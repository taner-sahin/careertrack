{% extends "base.html" %}

{% block title %}
{{ page_title }} | CareerTrack
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="mb-4">
        <h1 class="fw-bold">
            {{ page_title }}
        </h1>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Kaydet
                </button>

                <a
                    href="{% url 'reminders:reminder_list' %}"
                    class="btn btn-outline-secondary"
                >
                    İptal
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
