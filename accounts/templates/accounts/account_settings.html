{% extends "base.html" %} {% block title %} Ayarlar | CareerTrack {% endblock %}
{% block content %}

<div class="container-fluid py-4">
  <div class="mb-4">
    <h1 class="fw-bold mb-1">Ayarlar</h1>

    <p class="text-muted mb-0">Hesap bilgilerini görüntüle ve güncelle.</p>
  </div>

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %} {{ form.as_p }}

        <button type="submit" class="btn btn-primary px-4">
          Değişiklikleri Kaydet
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
